services:
  - type: web
    name: civicfix-bac
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "sh -c 'python migrate.py && python bootstrap.py && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT'"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: civicfix-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_APP_URL
        value: https://civicfix-ai.vercel.app
      - key: BACKEND_CORS_ORIGINS
        value: '["https://civicfix-ai.vercel.app","http://localhost:5173"]'
      - key: FRONTEND_ORIGINS
        value: "https://civicfix-ai.vercel.app"
      - key: AI_PROVIDER
        value: mock
      - key: RATE_LIMIT_ENABLED
        value: "True"
      - key: RATE_LIMIT_STORAGE_URL
        value: "memory://"
      - key: BEHIND_TRUSTED_PROXY
        value: "True"

databases:
  - name: civicfix-postgres
    plan: free
    region: oregon
    databaseName: civicfix_db
    user: civicfix_user
    ipAllowList: []
