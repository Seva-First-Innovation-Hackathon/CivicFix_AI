services:
  - type: web
    name: civicfix-bac
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "sh -c 'python migrate.py && ([ -n \"$INITIAL_ADMIN_PASSWORD\" ] && python bootstrap.py || true) && uvicorn app.main:app --host 0.0.0.0 --port $PORT'"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: civicfix-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: PUBLIC_APP_URL
        value: https://civic-fix-ai-plum.vercel.app
      - key: BACKEND_CORS_ORIGINS
        value: '["https://civic-fix-ai-plum.vercel.app"]'
      - key: FRONTEND_ORIGINS
        value: "https://civic-fix-ai-plum.vercel.app"
      - key: AI_PROVIDER
        value: mock
      - key: STORAGE_BACKEND
        value: local # Switch to r2 and supply R2_ACCOUNT_ID, R2_BUCKET_NAME, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY manually
      - key: REQUIRE_DURABLE_STORAGE
        value: "False" # Set "True" once Cloudflare R2 bucket and credentials are configured
      - key: QUEUE_BACKEND
        value: inline # Switch to redis and provision REDIS_URL + worker service for background processing
      - key: REDIS_URL
        sync: false
      - key: REQUIRE_REDIS
        value: "False" # Set "True" once external Redis endpoint is attached
      - key: RATE_LIMIT_ENABLED
        value: "True"
      - key: RATE_LIMIT_STORAGE_URL
        value: "memory://" # Automatically superseded by REDIS_URL when REDIS_URL is configured
      - key: BEHIND_TRUSTED_PROXY
        value: "True"

  # Background Worker Blueprint (NOTE: Render Background Workers require a paid starter plan; keep disabled until Redis + plan approved):
  # - type: worker
  #   name: civicfix-worker
  #   runtime: python
  #   region: oregon
  #   plan: starter
  #   rootDir: backend
  #   buildCommand: "pip install -r requirements.txt"
  #   startCommand: "python worker.py"
  #   envVars:
  #     - key: ENVIRONMENT
  #       value: production
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: civicfix-postgres
  #         property: connectionString
  #     - key: SECRET_KEY
  #       sync: false
  #     - key: QUEUE_BACKEND
  #       value: redis
  #     - key: REDIS_URL
  #       sync: false
  #     - key: STORAGE_BACKEND
  #       value: r2

databases:
  - name: civicfix-postgres
    plan: free
    region: oregon
    databaseName: civicfix_db
    user: civicfix_user
    ipAllowList: []
