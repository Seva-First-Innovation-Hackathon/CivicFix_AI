name: CivicFix AI CI

on:
  push:
    branches: [ main, master, 'phase-*', 'release/*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene-and-secret-scan:
    name: Repo Hygiene & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Git whitespace & conflict markers
        run: git diff --check

      - name: Scan repository for leaked credentials or hardcoded production secrets
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import sys

          patterns = [
              ("Google API Key", re.compile(r"AIza(?!FakeSecretKey)[0-9A-Za-z\-_]{20}")),
              ("AWS Access Key", re.compile(r"AKIA[0-9A-Z]{16}")),
              ("Private Key Block", re.compile(r"BEGIN (RSA|EC|OPENSSH) PRIVATE KEY")),
              (
                  "Legacy Seed/Compose Default Password",
                  re.compile(
                      "(" + "|".join([
                          "Admin" + "Secure2026!",
                          "CivicFix" + "Postgres2026!",
                          "Staff" + "@2026",
                          "Crew" + "@2026",
                          "Citizen" + "@2026",
                      ]) + ")"
                  ),
              ),
          ]
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          findings = []
          for path in tracked:
              if path.startswith("docs/") or path.endswith(".md") or path.endswith(".png") or path.endswith(".jpg"):
                  continue
              try:
                  with open(path, "r", encoding="utf-8", errors="ignore") as fh:
                      for lineno, line in enumerate(fh, 1):
                          for label, pat in patterns:
                              if pat.search(line):
                                  findings.append(f"{path}:{lineno} matched {label}")
              except OSError:
                  pass
          if findings:
              print("\n".join(findings), file=sys.stderr)
              sys.exit(1)
          print(f"Secret scan clean across {len(tracked)} tracked files.")
          PY

  backend-unit-and-migrations:
    name: Backend Unit Suite & SQLite Migration Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify multi-step SQLite Alembic upgrade/downgrade & worker CLI
        working-directory: backend
        env:
          ENVIRONMENT: testing
          DATABASE_URL: sqlite:///./ci_migration_check.db
          AI_PROVIDER: mock
          EMAIL_ENABLED: False
        run: |
          rm -f ci_migration_check.db
          python -m alembic upgrade 6b691e58bfaa
          python -m alembic upgrade b4e2d9c1f8a3
          python migrate.py
          python -m alembic downgrade adca60ea77e0
          python -m alembic upgrade head
          python worker.py --run-maintenance-once
          rm -f ci_migration_check.db

      - name: Run isolated backend pytest suite (unit & mock integration)
        working-directory: backend
        env:
          ENVIRONMENT: testing
          DATABASE_URL: sqlite:///./ci_unused_default.db
          AI_PROVIDER: mock
          EMAIL_ENABLED: False
        run: |
          python -m pytest tests/ -v -rs -W ignore
          rm -f ci_unused_default.db

  backend-postgis-redis-integration:
    name: Live PostgreSQL/PostGIS & Redis/ARQ Integration
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: civicfix_ci
          POSTGRES_PASSWORD: ci_test_only_password
          POSTGRES_DB: civicfix_postgis_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U civicfix_ci -d civicfix_postgis_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify live PostGIS migrations (upgrade chain & safe downgrade/re-upgrade)
        working-directory: backend
        env:
          ENVIRONMENT: testing
          DATABASE_URL: postgresql+psycopg2://civicfix_ci:ci_test_only_password@localhost:5432/civicfix_postgis_ci
          AI_PROVIDER: mock
          EMAIL_ENABLED: False
        run: |
          python -m alembic upgrade 6b691e58bfaa
          python -m alembic upgrade b4e2d9c1f8a3
          python migrate.py
          python -m alembic current
          python -m alembic downgrade d1a4e8c2f109
          python -m alembic upgrade head
          python -m alembic current

      - name: Run live PostgreSQL/PostGIS & Redis/ARQ integration tests
        working-directory: backend
        env:
          ENVIRONMENT: testing
          POSTGIS_TEST_DATABASE_URL: postgresql+psycopg2://civicfix_ci:ci_test_only_password@localhost:5432/civicfix_postgis_ci
          REDIS_TEST_URL: redis://localhost:6379/0
          AI_PROVIDER: mock
          EMAIL_ENABLED: False
        run: |
          python -m pytest \
            tests/test_phase2b_postgis.py::test_live_postgis_integration \
            tests/test_phase2_6_staging_live.py::test_phase2_6b_live_postgis_schema_spatial_queries_and_explain \
            tests/test_phase2c_queue_sla.py::test_live_redis_queue_connectivity \
            tests/test_phase2_6_staging_live.py::test_phase2_6d_live_redis_arq_worker_outbox_retry_and_rate_limit \
            -v -rs

      - name: Run optional staging R2 & Gemini integration tests (secrets-gated, fork-safe)
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: backend
        env:
          ENVIRONMENT: testing
          POSTGIS_TEST_DATABASE_URL: postgresql+psycopg2://civicfix_ci:ci_test_only_password@localhost:5432/civicfix_postgis_ci
          REDIS_TEST_URL: redis://localhost:6379/0
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python -m pytest \
            tests/test_phase2_5_staging_audit.py::test_live_r2_staging_bucket_rw \
            tests/test_phase2_5_staging_audit.py::test_live_gemini_text_and_vision_inference \
            tests/test_phase2_6_staging_live.py::test_phase2_6c_live_r2_api_exif_rbac_signed_url_and_migration \
            tests/test_phase2_6_staging_live.py::test_phase2_6e_live_gemini_text_image_crossmodal_and_provenance \
            tests/test_phase2_6_staging_live.py::test_phase2_6g_live_full_staging_end_to_end_workflow \
            -v -rs

  frontend-tests:
    name: Frontend Typecheck, Vitest & PWA Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run Vitest suite
        working-directory: frontend
        run: npm test -- --run

      - name: Run production build and verify PWA build artifacts
        working-directory: frontend
        run: |
          npm run build
          test -f dist/icons/icon-512-maskable.png
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
